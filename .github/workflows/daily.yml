# Daily sentiment snapshots for the whole universe (SPEC-he.md §10).
# Shards run in parallel on CPU; the student runs via ONNX from the model release.
# Snapshots live on the `data` branch (snapshots/<TICKER>.jsonl) so main stays code-only.
name: daily-snapshots

on:
  schedule:
    # main: before the US open, after the overnight news and most pre-market reports (15:00 Israel summer / 14:00 winter)
    - cron: "5 12 * * *"
    # refresh: mid-session (19:00 Israel summer / 18:00 winter). :05 because GitHub delays top-of-hour runs most
    - cron: "5 16 * * *"
  workflow_dispatch:

concurrency:
  group: daily-snapshots
  cancel-in-progress: false

env:
  MODEL_TAG: model-s2
  SHARDS: 8
  SENTIMENT_CACHE: ${{ github.workspace }}/.cache
  ST_BACKEND: onnx
  PYTHONUNBUFFERED: "1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # keyed on the model list only; a changed list restores the old cache and adds the new models
          key: hf-${{ hashFiles('sentiment/models/registry.py') }}
          restore-keys: hf-

      # re-uploaded assets under the same tag change the key, so no stale model is served
      - name: Fingerprint the model release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(gh release view "$MODEL_TAG" --json assets -q '[.assets[]|.name+.updatedAt]|join(",")' | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache student model
        id: student
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ env.MODEL_TAG }}-${{ steps.rel.outputs.sha }}

      - name: Download student model
        if: steps.student.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models/st-finsent-onnx
          gh release download "$MODEL_TAG" -p 'meta_*.joblib' -D models
          gh release download "$MODEL_TAG" -p '*' -D models/st-finsent-onnx --skip-existing
          rm -f models/st-finsent-onnx/meta_*.joblib

      # Model scores of items seen yesterday are reused, so a day mostly scores new items.
      - name: Cache model scores
        uses: actions/cache@v4
        with:
          path: .cache/model_cache.sqlite
          key: scores-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: scores-${{ matrix.shard }}-

      - name: Restore snapshot history
        run: |
          mkdir -p data/snapshots
          # first run: no data branch yet, history starts empty
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD snapshots | tar -x -C data || echo "no snapshots on the data branch yet"
          fi
          echo "$(ls data/snapshots | wc -l) snapshot files"
          (cd data/snapshots && sha1sum *.jsonl > ../restored.sha1 2>/dev/null) || : > data/restored.sha1

      - name: Analyze shard
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m sentiment analyze --tickers-file data/universe.txt \
            --shard ${{ matrix.shard }}/$SHARDS --no-llm --device cpu --out shard.json \
            --run ${{ github.event_name == 'workflow_dispatch' && 'manual' || (github.event.schedule == '5 16 * * *' && 'refresh' || 'main') }}

      # every file that changed since the restore: only this shard writes here, and the engine may
      # normalize a symbol (universe BRK-B is saved as BRK.B); a timeout still keeps the tickers already done
      - name: Collect this shard's snapshot files
        if: always()
        run: |
          mkdir -p out/snapshots
          python - <<'EOF'
          import hashlib, pathlib, shutil
          before = {}
          for line in pathlib.Path("data/restored.sha1").read_text().splitlines():
              h, name = line.split(maxsplit=1)
              before[name.lstrip("*")] = h
          n = 0
          for f in sorted(pathlib.Path("data/snapshots").glob("*.jsonl")):
              if hashlib.sha1(f.read_bytes()).hexdigest() != before.get(f.name):
                  shutil.copy(f, "out/snapshots/")
                  n += 1
          print(n, "updated snapshot files")
          EOF
          [ -f shard.json ] && cp shard.json out/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 14

  # Secrets live only in this job, which does no scraping. Without the secrets it logs and skips.
  store:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "httpx>=0.27" "python-dotenv>=1.0"

      - uses: actions/download-artifact@v4
        with:
          path: shards

      - name: Write to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          shopt -s nullglob
          files=(shards/shard-*/shard.json)
          args=(--universe data/universe.txt)
          if [ ${#files[@]} -gt 0 ]; then args+=(--results "${files[@]}"); fi
          args+=(--run ${{ github.event_name == 'workflow_dispatch' && 'manual' || (github.event.schedule == '5 16 * * *' && 'refresh' || 'main') }})
          # a Supabase outage can outlast the per-request backoff (29/10: ~40 min of 504s); the writes are
          # idempotent, so the whole store is retried twice, 10 minutes apart
          for try in 1 2 3; do
            python -m sentiment store "${args[@]}" && exit 0
            [ $try -lt 3 ] && { echo "store failed (try $try); retrying in 10 min"; sleep 600; }
          done
          exit 1

  commit:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        run: |
          if git fetch origin data; then
            git checkout -B data FETCH_HEAD
          else
            git checkout --orphan data
            git rm -rf --quiet .
            echo "Daily sentiment snapshots written by .github/workflows/daily.yml" > README.md
          fi

      - uses: actions/download-artifact@v4
        with:
          path: shards

      - name: Merge and commit
        run: |
          mkdir -p snapshots
          n=0
          for d in shards/shard-*/snapshots; do
            [ -d "$d" ] && cp "$d"/*.jsonl snapshots/ 2>/dev/null && n=$((n+1))
          done
          echo "merged $n shards"
          git add README.md snapshots
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "snapshots $(date -u +"%F %H:%M") UTC"
          git push origin data

      # GitHub disables schedules in public repos after 60 days without activity; bot pushes to `data` may not count
      - name: Keep the schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/enable"
