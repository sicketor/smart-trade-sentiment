# On-demand analysis for up to 5 tickers, dispatched by the HUB (SPEC-he.md).
# Marks the requests running, pulls their history from Supabase, analyzes, writes run=ondemand, closes the requests.
name: ondemand-analysis

on:
  workflow_dispatch:
    inputs:
      requests:
        description: "TICKER=request_id pairs, comma-separated, up to 5"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # steps have their own limits, so a slow step fails and Store results still closes the requests
    env:
      SENTIMENT_CACHE: ${{ github.workspace }}/.cache
      ST_BACKEND: onnx
      PYTHONUNBUFFERED: "1"
      MODEL_TAG: model-s2
      REQS: ${{ inputs.requests }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      # store imports httpx only, so a bad request fails before the heavy install
      - name: Validate request
        id: req
        run: |
          pip install "httpx>=0.27" "python-dotenv>=1.0"
          python -c "
          import os
          from sentiment.store import parse_requests
          t = [t for t, _ in parse_requests(os.environ['REQS'])]
          open(os.environ['GITHUB_OUTPUT'], 'a').write('tickers=' + ' '.join(t) + '\n')
          "

      # same as daily.yml
      - name: Install
        timeout-minutes: 8
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      # same as daily.yml
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('sentiment/models/registry.py') }}
          restore-keys: hf-

      # same as daily.yml
      - name: Fingerprint the model release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(gh release view "$MODEL_TAG" --json assets -q '[.assets[]|.name+.updatedAt]|join(",")' | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # same as daily.yml
      - name: Cache student model
        id: student
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ env.MODEL_TAG }}-${{ steps.rel.outputs.sha }}

      # same as daily.yml
      - name: Download student model
        if: steps.student.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models/st-finsent-onnx
          gh release download "$MODEL_TAG" -p 'meta_*.joblib' -D models
          gh release download "$MODEL_TAG" -p '*' -D models/st-finsent-onnx --skip-existing
          rm -f models/st-finsent-onnx/meta_*.joblib

      - name: Mark running + pull history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m sentiment store --requests "$REQS" --mark running --pull-history --to data/snapshots

      - name: Analyze
        timeout-minutes: 15
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m sentiment analyze ${{ steps.req.outputs.tickers }} --no-llm --device cpu --out out.json --run ondemand --no-save

      - name: Store results
        if: always() && steps.req.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          args=(--requests "$REQS" --run ondemand)
          [ -f out.json ] && args+=(--results out.json)
          python -m sentiment store "${args[@]}"
